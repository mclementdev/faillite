<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Faillite ! · Voter au curseur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15131C}
a{color:#FFD23F}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; background: #15131C; color: #F6F1E7; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 16px; font-weight: 700; color: #D9D2E3"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #F6F1E7">2035</span> · Tour 9/30</span>
    <span style="display: inline-flex; align-items: center; gap: 8px; background: #FFD23F; color: #15131C; border-radius: 999px; padding: 6px 14px 6px 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><polyline points="12 9 12 13 14.5 14.5"></polyline><line x1="10" y1="2.5" x2="14" y2="2.5"></line></svg>
      1:15
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #15131C; background: #FFD23F; padding: 3px 8px; border-radius: 6px">CURSEUR · LA MÉDIANE L'EMPORTE</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 25px; line-height: 1.1">À quel âge part-on à la retraite ?</h1>
  </div>

  <!-- Valeur et réglage -->
  <div style="display: flex; flex-direction: column; gap: 14px; background: #221F2B; border-radius: 22px; padding: 18px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" onClick="{{minus}}" aria-label="Diminuer" style="width: 60px; height: 60px; border-radius: 50%; background: #2C2838; color: #F6F1E7; border: 2px solid #4A4458; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums">{{value}}<span style="font-size: 26px; font-weight: 700; color: #B4ADBF"> ans</span></span>
      <button type="button" onClick="{{plus}}" aria-label="Augmenter" style="width: 60px; height: 60px; border-radius: 50%; background: #2C2838; color: #F6F1E7; border: 2px solid #4A4458; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg>
      </button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px" role="radiogroup" aria-label="Âge de départ">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.v}}</button>
      </sc-for>
    </div>
  </div>

  <!-- Explication de la valeur choisie -->
  <div style="display: flex; flex-direction: column; gap: 10px; background: #2C2838; border-radius: 18px; padding: 14px 16px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #B4ADBF">EFFET SUR PLUSIEURS ANNÉES</span>
    <span style="font-size: 15px; line-height: 1.4; color: #D9D2E3">{{text}}</span>
    <span style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{pills}}" as="p" hint-placeholder-count="3">
        <span style="{{p.style}}">{{p.label}}</span>
      </sc-for>    </span>
  </div>

  <div style="flex: 1"></div>

  <sc-if value="{{notVoted}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{vote}}" style="height: 62px; background: #FFD23F; color: #15131C; border: 0; border-radius: 18px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; cursor: pointer">Voter {{value}} ans</button>
  </sc-if>
  <sc-if value="{{voted}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display: flex; align-items: center; gap: 10px; background: #1E3A2B; border: 2px solid #2ED47A; border-radius: 16px; padding: 14px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#2ED47A"></circle><polyline points="7 12 10.5 15.5 17 9" fill="none" stroke="#15131C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      <span style="font-size: 15px; line-height: 1.3"><b>{{value}} ans enregistré.</b> Change la valeur pour revoter.</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { value: 64, voted: false };
  }
  renderVals() {
    const v = this.state.value;
    const C = { n2: '#FF4D5E', n1: '#FF9A3C', p1: '#A6E36B', p2: '#2ED47A' };
    const pill = (lvl, label) => ({ label: label, style: 'display: inline-flex; padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 13px; color: #15131C; background: ' + C[lvl] });
    const info = {
      62: { text: 'Plus de retraités à financer, moins de cotisants : la facture grimpe, la tension sociale baisse.', pills: [pill('n1', '▼ Finances'), pill('p1', '▲ Paix sociale')] },
      63: { text: 'Entre 62 et 64 ans : effets intermédiaires, plus doux dans les deux sens.', pills: [pill('n1', '▼ Finances'), pill('p1', '▲ Paix sociale')] },
      64: { text: "Plus de cotisants et moins de pensions versées : les comptes s'améliorent, mais la mesure est mal vécue au début.", pills: [pill('p1', '▲ Finances'), pill('n1', '▼ Paix sociale'), pill('p1', '▲ Économie')] },
      65: { text: 'Entre 64 et 66 ans : les comptes s’améliorent nettement, la contestation monte.', pills: [pill('p1', '▲ Finances'), pill('n1', '▼ Paix sociale'), pill('n1', '▼ Cohésion')] },
      66: { text: 'Effet très fort sur les comptes, mais touche surtout les carrières longues et les métiers pénibles.', pills: [pill('p2', '▲▲ Finances'), pill('n2', '▼▼ Paix sociale'), pill('n1', '▼ Cohésion')] }
    };
    const set = (x) => this.setState({ value: Math.max(62, Math.min(66, x)), voted: false });
    const steps = [62, 63, 64, 65, 66].map((x) => ({
      v: x,
      checked: x === v ? 'true' : 'false',
      pick: () => set(x),
      style: 'height: 48px; border-radius: 12px; font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer; '
        + (x === v ? 'background: #FFD23F; color: #15131C; border: 0;' : 'background: transparent; color: #F6F1E7; border: 2px solid #4A4458;')
    }));
    return {
      value: v,
      steps: steps,
      text: info[v].text,
      pills: info[v].pills,
      minus: () => set(v - 1),
      plus: () => set(v + 1),
      voted: this.state.voted,
      notVoted: !this.state.voted,
      vote: () => this.setState({ voted: true })
    };
  }
}
</script>
</body>
</html>
